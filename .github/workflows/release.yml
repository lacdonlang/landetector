name: Release

# Pushing a tag such as `v1.2.0` tests, builds and signs the app and publishes LanDetector-1.2.0.zip as a GitHub
# release (`v1.2.0-beta.1` becomes a pre-release). Running the workflow by hand builds the same zip as a workflow
# artifact and publishes nothing.
#
# Optional repository secrets:
#   DEVELOPER_ID_P12           "Developer ID Application" certificate with its private key, as base64 of the .p12.
#   DEVELOPER_ID_P12_PASSWORD  Its password.
#                              Without the certificate the app is ad-hoc signed: it scans, but macOS 27 only shows
#                              ARP / NDP MAC addresses to Developer ID signed apps.
#   NOTARY_APPLE_ID            Apple ID for notarization (needs the certificate).
#   NOTARY_PASSWORD            App-specific password of that Apple ID.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      HAS_CERT: ${{ secrets.DEVELOPER_ID_P12 != '' }}
      HAS_NOTARY: ${{ secrets.NOTARY_APPLE_ID != '' && secrets.NOTARY_PASSWORD != '' }}
      TEAM_ID: N4828PE57J
    steps:
      - uses: actions/checkout@v7

      - name: Version
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev.$GITHUB_RUN_NUMBER"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Test
        run: swift test --package-path Packages/LanDetectorKit

      - name: Import Developer ID certificate
        if: env.HAS_CERT == 'true'
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Build
        run: |
          if [[ "$HAS_CERT" == true ]]; then
            # Notarization needs a secure timestamp, which plain builds leave out.
            SIGNING=("OTHER_CODE_SIGN_FLAGS=--timestamp --keychain $KEYCHAIN")
          else
            SIGNING=(CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=)
          fi
          xcodebuild -project LanDetector.xcodeproj -scheme LanDetector -configuration Release \
            -derivedDataPath build/DerivedData -destination 'generic/platform=macOS' \
            MARKETING_VERSION="${VERSION%%-*}" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" "${SIGNING[@]}" build
          mkdir -p dist
          ditto build/DerivedData/Build/Products/Release/LanDetector.app dist/LanDetector.app
          codesign --verify --deep --strict --verbose=2 dist/LanDetector.app

      - name: Notarize
        if: env.HAS_CERT == 'true' && env.HAS_NOTARY == 'true'
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          ditto -c -k --keepParent dist/LanDetector.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --apple-id "$NOTARY_APPLE_ID" \
            --password "$NOTARY_PASSWORD" --team-id "$TEAM_ID" --wait --timeout 30m
          xcrun stapler staple dist/LanDetector.app

      - name: Package
        run: |
          ZIP="LanDetector-$VERSION.zip"
          ditto -c -k --keepParent dist/LanDetector.app "dist/$ZIP"
          (cd dist && shasum -a 256 "$ZIP" > "$ZIP.sha256")
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: LanDetector-${{ env.VERSION }}
          path: dist/LanDetector-*.zip*

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=""
          if [[ "$HAS_CERT" != true ]]; then
            NOTES="> 此版本为 ad-hoc 签名：可以扫描，但 macOS 27 只向 Developer ID 签名的应用开放 ARP 表，看不到 MAC 地址与厂商。首次打开需在“系统设置 ▸ 隐私与安全性”中允许。"
          elif [[ "$HAS_NOTARY" != true ]]; then
            NOTES="> 此版本已用 Developer ID 签名但未经公证，首次打开需在“系统设置 ▸ 隐私与安全性”中允许。"
          fi
          PRERELEASE=()
          if [[ "$VERSION" == *-* ]]; then PRERELEASE=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "dist/$ZIP" "dist/$ZIP.sha256" --verify-tag \
            --title "LanDetector $VERSION" --generate-notes --notes "$NOTES" "${PRERELEASE[@]}"
